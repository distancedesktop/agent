<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distance Desktop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d0d0d;color:#e0e0e0;display:flex;justify-content:center;align-items:center;min-height:100vh}
.container{text-align:center;padding:2rem}
h1{font-size:1.5rem;font-weight:600;margin-bottom:1.5rem;color:#fff}
.fingerprint{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:1.5rem;margin:1.5rem 0;font-family:'SF Mono',Monaco,'Cascadia Code',monospace;font-size:0.75rem;word-break:break-all;line-height:1.8;color:#7cdf7c;letter-spacing:0.05em}
.label{color:#888;font-size:0.80rem;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.5rem}
.ips{color:#999;font-size:0.85rem;margin-top:1rem}
.ips span{color:#ccc}
.qr{margin:1.5rem auto;width:200px;height:200px;background:#fff;padding:12px;border-radius:8px}
.qr img{width:100%;height:100%}
.hint{color:#666;font-size:0.80rem;margin-top:1rem;line-height:1.6}
</style>
</head>
<body>
<div class="container">
  <h1>Distance Desktop</h1>
  <div class="label">Server Fingerprint</div>
  <div class="fingerprint" id="fingerprint">loading...</div>
  <div class="qr" id="qr"><div style="color:#999;padding-top:80px">QR</div></div>
  <div class="ips" id="ips">loading IPs...</div>
  <div class="hint">Copy this fingerprint into the Distance Desktop client<br>to establish a secure connection.</div>
</div>
<script>
async function load() {
  const r = await fetch('/api/info');
  const data = await r.json();
  const fp = document.getElementById('fingerprint');
  fp.textContent = data.fingerprint;
  const ips = document.getElementById('ips');
  ips.innerHTML = 'Server IPs: ' + data.ips.map(ip => '<span>' + ip + '</span>').join(', ');
}
load();
</script>
</body>
</html>
